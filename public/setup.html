<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-remote · 飞书绑定</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --fg: #1a1d21; --muted: #6b7280; --card: #ffffff; --border: #e5e7eb;
    --ok: #059669; --warn: #dc2626; --accent: #2563eb; --accent-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --fg: #e7e9ec; --muted: #9ca3af; --card: #1a1e24; --border: #2a2f37; --ok: #34d399; }
  }
  * { box-sizing: border-box; }
  body { font: 15px/1.6 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); margin: 0; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  h1 { font-size: 1.15rem; text-align: center; margin: 0 0 1.25rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 1.5rem 1.25rem; text-align: center; }
  .qr { width: 220px; height: 220px; margin: .5rem auto; background: #fff; border-radius: 10px; padding: 10px; }
  .qr svg { width: 100%; height: 100%; }
  button { font: inherit; font-size: 14px; padding: .4rem 1.2rem; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--border); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  a { color: var(--accent); word-break: break-all; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { padding: 2rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 agent-remote · 飞书一键绑定</h1>
  <div class="card"><div id="stage" class="empty muted">正在准备…</div></div>
</div>

<script src="/setup.js"></script>
</body>
</html>
