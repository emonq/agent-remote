<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-remote</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --fg: #1a1d21; --muted: #6b7280; --card: #ffffff;
    --border: #e5e7eb; --accent: #2563eb; --accent-fg: #fff;
    --ok: #059669; --warn: #d97706; --chip-ok: #ecfdf5; --chip-warn: #fffbeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --fg: #e7e9ec; --muted: #9ca3af; --card: #1a1e24;
      --border: #2a2f37; --accent: #3b82f6; --ok: #34d399; --warn: #fbbf24;
      --chip-ok: #052e21; --chip-warn: #2d2006;
    }
  }
  * { box-sizing: border-box; }
  body { font: 15px/1.6 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); margin: 0; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header { display: flex; align-items: center; gap: .75rem; margin-bottom: 2rem; }
  .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--accent-fg);
          display: grid; place-items: center; font-size: 19px; }
  h1 { font-size: 1.25rem; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 1.1rem 1.25rem; margin: .75rem 0; }
  .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
             color: var(--muted); margin: 0 0 .75rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

  .chip { font-size: 12px; padding: .15rem .6rem; border-radius: 99px; }
  .chip.ok { background: var(--chip-ok); color: var(--ok); }
  .chip.warn { background: var(--chip-warn); color: var(--warn); }

  code, .token { font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; }
  code { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent);
         padding: .15em .5em; border-radius: 6px; }
  .token { background: color-mix(in srgb, var(--muted) 12%, transparent); padding: .45em .7em;
           border-radius: 8px; word-break: break-all; display: inline-block; }

  button { font: inherit; font-size: 14px; padding: .4rem 1rem; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--border); background: var(--card); color: var(--fg); transition: filter .15s; }
  button:hover { filter: brightness(1.08); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger { color: #dc2626; border-color: color-mix(in srgb, #dc2626 40%, var(--border)); }
  .muted { color: var(--muted); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
       padding: .4rem .5rem; border-bottom: 1px solid var(--border); }
  td { padding: .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .tag { font-size: 12px; padding: .1rem .55rem; border-radius: 5px; white-space: nowrap;
         background: color-mix(in srgb, var(--muted) 12%, transparent); color: var(--muted); }
  .tag.ask { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .tag.solved { background: var(--chip-ok); color: var(--ok); }
  .tag.timeout { background: var(--chip-warn); color: var(--warn); }
  .clip { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { text-align: center; padding: 1.5rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🤖</div>
    <div style="flex:1">
      <h1>agent-remote</h1>
      <div class="sub">把 agent 的决策问题推到你的飞书</div>
    </div>
    <button id="logout" style="display:none" class="muted">退出</button>
  </header>
  <div id="app"><div class="empty muted">加载中…</div></div>
</div>

<script>
// 用 <template> 解析: tr/td 等 table 片段在 div.innerHTML 里会被浏览器丢弃
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => { const d = document.createElement('span'); d.textContent = s; return d.innerHTML; };

async function main() {
  const me = await fetch('/api/me').then((r) => r.json()).catch(() => null);
  const app = document.getElementById('app');
  app.innerHTML = ''; // 清掉"加载中"占位

  if (!me) { app.innerHTML = '<div class="card"><div class="empty">服务异常，稍后重试</div></div>'; return; }
  if (me.login) { // 未登录 → OIDC (跳转失败时给出可见提示而不是挂着"加载中")
    app.innerHTML = '<div class="card"><div class="empty">正在跳转登录…<div class="muted" style="margin-top:.5rem">没有跳转？<a href="' + esc(me.login) + '">手动登录</a></div></div></div>';
    location.href = me.login;
    return;
  }

  // 单用户模式: 没有账号体系, 只展示事件 (token 在 .env 里)
  if (!me.single) {
    document.getElementById('logout').style.display = '';
    document.getElementById('logout').onclick = async () => {
      await fetch('/auth/logout', { method: 'POST' });
      location.reload();
    };
    // 账号
    app.append($(`
      <div class="card">
        <h2>账号</h2>
        <div class="row">
          <strong>${esc(me.name)}</strong>
          ${me.bound
            ? '<span class="chip ok">✓ 飞书已绑定</span>'
            : '<span class="chip warn">未绑定飞书</span>'}
        </div>
      </div>`));

  // 飞书绑定
  const bindCard = $('<div class="card"><h2>飞书绑定</h2><div class="bind"></div></div>');
  app.append(bindCard);
  const renderBind = (code) => {
    const el = bindCard.querySelector('.bind');
    el.innerHTML = code
      ? `<div class="row"><div>在飞书给机器人发&nbsp;<code>/bind ${esc(code)}</code></div><button id="bind" class="primary">重新生成</button></div>
         <div class="muted" style="margin-top:.4rem">10 分钟内有效，发送后自动完成绑定</div>`
      : `<div class="row"><div class="muted">生成绑定码，在飞书发送即可绑定你的账号</div><button id="bind" class="primary">生成绑定码</button></div>`;
    el.querySelector('#bind').onclick = async () => {
      el.innerHTML = '<div class="muted">生成中…</div>';
      renderBind((await fetch('/api/bind-code', { method: 'POST' }).then((r) => r.json())).code);
    };
  };
  renderBind();

  // token
  const tokenCard = $('<div class="card"><h2>API Token</h2><div class="tok"></div></div>');
  app.append(tokenCard);
  // token: 默认打码, 可显示/复制/重置
  const renderToken = (t, shown = false) => {
    const el = tokenCard.querySelector('.tok');
    el.innerHTML = `<div class="row"><span class="token">${esc(shown ? t : t.slice(0, 6) + '••••••••••••••••')}</span>
        <span><button id="toggle">${shown ? '隐藏' : '显示'}</button> <button id="copy">复制</button> <button id="rot" class="danger">重置</button></span></div>
      <div class="muted" style="margin-top:.4rem">用于 MCP / hook 的 Bearer 认证，重置后旧 token 立即失效</div>`;
    el.querySelector('#toggle').onclick = () => renderToken(t, !shown);
    el.querySelector('#copy').onclick = () => navigator.clipboard.writeText(t);
    el.querySelector('#rot').onclick = async () => {
      if (!confirm('重置后所有使用旧 token 的客户端都会失效，继续？')) return;
      renderToken((await fetch('/api/rotate-token', { method: 'POST' }).then((r) => r.json())).token);
    };
  };
  renderToken((await fetch('/api/token').then((r) => r.json())).token);
  }

  // 事件
  const typeZh = { ask: '提问', solved: '已回复', timeout: '超时', hook: 'hook', bind: '绑定', token_rotated: '重置 token' };
  const ev = $(`<div class="card"><h2>最近事件</h2>
    <table><thead><tr><th style="width:140px">时间</th><th style="width:72px">类型</th><th>内容</th></tr></thead><tbody></tbody></table>
    <div class="empty muted" style="display:none">暂无事件</div></div>`);
  app.append(ev);
  const rows = ev.querySelector('tbody');
  const events = me.events || [];
  for (const e of events) {
    const p = JSON.parse(e.payload);
    // 提问/超时/hook 显示问题或消息; 已回复显示 问题 → 答案
    let detail = p.question ?? p.message ?? '';
    if (e.type === 'solved' && p.question) detail = p.answer != null ? `${p.question} → ${p.answer}` : p.question;
    rows.append($(`<tr><td class="muted" style="white-space:nowrap">${new Date(e.created_at).toLocaleString()}</td>
      <td><span class="tag ${esc(e.type)}">${typeZh[e.type] || esc(e.type)}</span></td>
      <td><div class="clip" title="${esc(detail)}">${esc(String(detail))}</div></td></tr>`));
  }
  if (!events.length) ev.querySelector('.empty').style.display = '';
}
main();
</script>
</body>
</html>
