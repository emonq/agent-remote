<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-remote</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --fg: #1a1d21; --muted: #6b7280; --card: #ffffff;
    --border: #e5e7eb; --accent: #2563eb; --accent-fg: #fff;
    --ok: #059669; --warn: #d97706; --chip-ok: #ecfdf5; --chip-warn: #fffbeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --fg: #e7e9ec; --muted: #9ca3af; --card: #1a1e24;
      --border: #2a2f37; --accent: #3b82f6; --ok: #34d399; --warn: #fbbf24;
      --chip-ok: #052e21; --chip-warn: #2d2006;
    }
  }
  * { box-sizing: border-box; }
  body { font: 15px/1.6 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); margin: 0; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header { display: flex; align-items: center; gap: .75rem; margin-bottom: 2rem; }
  .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--accent-fg);
          display: grid; place-items: center; font-size: 19px; }
  h1 { font-size: 1.25rem; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 1.1rem 1.25rem; margin: .75rem 0; }
  .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
             color: var(--muted); margin: 0 0 .75rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

  .chip { font-size: 12px; padding: .15rem .6rem; border-radius: 99px; }
  .chip.ok { background: var(--chip-ok); color: var(--ok); }
  .chip.warn { background: var(--chip-warn); color: var(--warn); }

  code, .token { font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; }
  code { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent);
         padding: .15em .5em; border-radius: 6px; }
  .token { background: color-mix(in srgb, var(--muted) 12%, transparent); padding: .45em .7em;
           border-radius: 8px; word-break: break-all; display: inline-block; }

  input { font: inherit; font-size: 14px; padding: .4rem .7rem; border-radius: 8px;
          border: 1px solid var(--border); background: var(--bg); color: var(--fg); flex: 1; min-width: 0; }

  button { font: inherit; font-size: 14px; padding: .4rem 1rem; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--border); background: var(--card); color: var(--fg); transition: filter .15s; }
  button:hover { filter: brightness(1.08); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger { color: #dc2626; border-color: color-mix(in srgb, #dc2626 40%, var(--border)); }
  .muted { color: var(--muted); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
       padding: .4rem .5rem; border-bottom: 1px solid var(--border); }
  td { padding: .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .tag { font-size: 12px; padding: .1rem .55rem; border-radius: 5px; white-space: nowrap;
         background: color-mix(in srgb, var(--muted) 12%, transparent); color: var(--muted); }
  .tag.ask { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .tag.solved { background: var(--chip-ok); color: var(--ok); }
  .tag.timeout { background: var(--chip-warn); color: var(--warn); }
  .clip { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { text-align: center; padding: 1.5rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🤖</div>
    <div style="flex:1">
      <h1>agent-remote</h1>
      <div class="sub">把 agent 的决策问题推到你的飞书</div>
    </div>
    <button id="logout" style="display:none" class="muted">退出</button>
  </header>
  <div id="app"><div class="empty muted">加载中…</div></div>
</div>

<script src="/app.js"></script>
</body>
</html>
